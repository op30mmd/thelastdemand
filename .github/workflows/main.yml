name: Bundle WinUI Offline Installer
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  bundle-workload:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download VS Bootstrapper
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Create Offline Layout
        run: |
          $params = "--layout `"${{ github.workspace }}\WinUI_Layout`" ",
                    "--add Microsoft.VisualStudio.Workload.CoreEditor ",
                    "--includeRecommended ",
                    "--lang en-US ",
                    "--quiet ",
                    "--norestart ",
                    "--wait"
          
          Write-Host "Starting download/layout process..."
          $process = Start-Process -FilePath ".\vs_community.exe" -ArgumentList $params -Wait -PassThru
          
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Write-Error "Visual Studio Installer failed with exit code $($process.ExitCode)"
            exit 1
          }

      - name: Ultra Aggressive Compression & Splitting (7-Zip)
        run: |
          # -v2000m: Splits the archive into 2000MB parts to stay under the 2GB GitHub limit
          # -mx9, -md256m, -ms=on: Aggressive settings as discussed
          7z a -t7z -m0=lzma2 -mx=9 -md=256m -mfb=273 -ms=on -myx=9 -v2000m WinUI_Offline_Bundle.7z "${{ github.workspace }}\WinUI_Layout"

      - name: Create Release and Upload Parts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use a wildcard to upload all parts (.7z.001, .7z.002, etc.)
          gh release create ${{ github.event.inputs.version }} WinUI_Offline_Bundle.7z.* `
            --title "WinUI Offline Installer ${{ github.event.inputs.version }}" `
            --notes "Optimized offline layout for WinUI 3. Split into 2GB parts due to GitHub upload limits. To extract: Download all parts and open the .001 file with 7-Zip."
