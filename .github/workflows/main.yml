name: Bundle WinUI Offline Installer
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  bundle-workload:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        # This fixes the "failed to run git" error
        uses: actions/checkout@v4

      - name: Download VS Bootstrapper
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Create Offline Layout
        run: |
          $params = "--layout `"${{ github.workspace }}\WinUI_Layout`" ",
                    "--add Microsoft.VisualStudio.Workload.Universal ",
                    "--includeRecommended ",
                    "--lang en-US ",
                    "--quiet ",
                    "--norestart ",
                    "--wait"
          
          Write-Host "Starting download/layout process..."
          $process = Start-Process -FilePath ".\vs_community.exe" -ArgumentList $params -Wait -PassThru
          
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Write-Error "Visual Studio Installer failed with exit code $($process.ExitCode)"
            exit 1
          }

      - name: Ultra Aggressive Compression (7-Zip LZMA2)
        run: |
          # TUNING PARAMETERS:
          # -m0=lzma2: Uses the strongest algorithm
          # -mx=9: Level 9 (Ultra)
          # -md=256m: 256MB dictionary (Higher = better compression, requires more RAM. GitHub has 7GB RAM, so this is safe)
          # -mfb=273: Maximize number of fast bytes for matches
          # -ms=on: Solid archive (Treats all files as one stream; essential for VS layouts)
          # -myx=9: Extensive file analysis
          
          7z a -t7z -m0=lzma2 -mx=9 -md=256m -mfb=273 -ms=on -myx=9 WinUI_Offline_Bundle.7z "${{ github.workspace }}\WinUI_Layout"

      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh CLI now works because of the checkout step
          gh release create ${{ github.event.inputs.version }} WinUI_Offline_Bundle.7z `
            --title "WinUI Offline Installer ${{ github.event.inputs.version }}" `
            --notes "Optimized offline layout for WinUI 3 / Windows App SDK."
