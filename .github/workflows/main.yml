name: Bundle WinUI Offline Installer
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  bundle-workload:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Download VS Bootstrapper
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Create Offline Layout
        run: |
          # --wait is CRITICAL. Without it, the script continues before the download finishes.
          # --nocache reduces the final size by not keeping duplicate installer files.
          ./vs_community.exe --layout ${{ github.workspace }}\WinUI_Layout `
            --add Microsoft.VisualStudio.Workload.Universal `
            --includeRecommended `
            --lang en-US `
            --passive `
            --norestart `
            --wait

      - name: Verify Layout Folder
        run: |
          if (Test-Path -Path ".\WinUI_Layout") {
              Write-Host "Layout folder created successfully."
              Get-ChildItem -Path ".\WinUI_Layout"
          } else {
              Write-Error "Layout folder was NOT created. The installer likely failed."
              exit 1
          }

      - name: Aggressive Compression (7-Zip)
        run: |
          # Using absolute paths to ensure 7z finds the folder
          # -mx9: Ultra compression
          # -ms=on: Solid archive (crucial for VS layouts with many small files)
          7z a -t7z -mx=9 -ms=on WinUI_Offline_Bundle.7z "${{ github.workspace }}\WinUI_Layout"

      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} WinUI_Offline_Bundle.7z `
            --title "WinUI Offline Installer ${{ github.event.inputs.version }}" `
            --notes "Offline layout for WinUI 3 / Windows App SDK (Microsoft.VisualStudio.Workload.Universal)"
