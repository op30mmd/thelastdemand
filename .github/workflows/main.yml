name: Bundle WinUI Offline Installer
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  bundle-workload:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Download VS Bootstrapper
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Create Offline Layout
        run: |
          # We use Start-Process -Wait to ensure PowerShell stays attached until completion.
          # --quiet is preferred over --passive for headless environments.
          $params = "--layout `"${{ github.workspace }}\WinUI_Layout`" ",
                    "--add Microsoft.VisualStudio.Workload.Universal ",
                    "--includeRecommended ",
                    "--lang en-US ",
                    "--quiet ",
                    "--norestart ",
                    "--wait"
          
          Write-Host "Starting download/layout process... This will take several minutes."
          
          $process = Start-Process -FilePath ".\vs_community.exe" -ArgumentList $params -Wait -PassThru
          
          Write-Host "Installer exited with code: $($process.ExitCode)"
          
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Write-Error "Visual Studio Installer failed with exit code $($process.ExitCode)"
            exit 1
          }

      - name: Verify Layout Folder
        run: |
          if (Test-Path -Path "${{ github.workspace }}\WinUI_Layout") {
              $size = (Get-ChildItem "${{ github.workspace }}\WinUI_Layout" -Recurse | Measure-Object -Property Length -Sum).Sum / 1GB
              Write-Host "Layout folder created. Total size: $('{0:N2}' -f $size) GB"
          } else {
              Write-Error "Layout folder was NOT created."
              exit 1
          }

      - name: Aggressive Compression (7-Zip)
        run: |
          # -mx9: Ultra compression
          # -ms=on: Solid archive (required for high compression on VS layouts)
          7z a -t7z -mx=9 -ms=on WinUI_Offline_Bundle.7z "${{ github.workspace }}\WinUI_Layout"

      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} WinUI_Offline_Bundle.7z `
            --title "WinUI Offline Installer ${{ github.event.inputs.version }}" `
            --notes "Offline layout for WinUI 3 / Windows App SDK (Microsoft.VisualStudio.Workload.Universal)"
