name: Unified WinUI Offline Bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0'

jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Bootstrapper
        run: Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Check Disk Space
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Create Unified Layout
        run: |
          $layout = "${{ github.workspace }}\VS_Layout"

          $argList = @(
            "--layout `"$layout`"",
            "--add Microsoft.VisualStudio.Workload.CoreEditor",
            "--add Microsoft.VisualStudio.Workload.Universal",
            "--add Microsoft.VisualStudio.Workload.ManagedDesktop",
            "--add Microsoft.VisualStudio.Workload.NativeDesktop",
            "--includeRecommended",
            "--includeOptional",
            "--lang en-US",
            "--passive",
            "--norestart"
          )

          $proc = Start-Process `
            -FilePath ".\vs_community.exe" `
            -ArgumentList ($argList -join " ") `
            -Wait `
            -PassThru

          Write-Host "Exit code: $($proc.ExitCode)"

          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            Write-Error "VS layout creation failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Ultra Compression & Splitting
        run: |
          7z a -t7z -m0=lzma2 -mx=9 -md=128m -ms=on -v2000m VS_Offline_Final.7z "${{ github.workspace }}\VS_Layout"

      - name: Cleanup Layout to Save Space
        run: Remove-Item -Recurse -Force "${{ github.workspace }}\VS_Layout"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} VS_Offline_Final.7z.* `
            --title "Full Offline VS Layout ${{ github.event.inputs.version }}" `
            --notes "Includes: Core, WinUI, .NET Desktop, and C++ Desktop. Download ALL parts, extract the .001 file."
