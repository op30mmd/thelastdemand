name: Unified WinUI Offline Bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0'

jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Bootstrapper
        run: Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Check Disk Space
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Create Unified Layout
        run: |
          $layout = "${{ github.workspace }}\VS_Layout"

          $argList = @(
            "--layout `"$layout`"",
            "--add Microsoft.VisualStudio.Workload.CoreEditor",
            "--add Microsoft.VisualStudio.Workload.Universal",
            "--add Microsoft.VisualStudio.Workload.ManagedDesktop",
            "--add Microsoft.VisualStudio.Workload.NativeDesktop",
            "--includeRecommended",
            "--includeOptional",
            "--lang en-US",
            "--passive",
            "--norestart"
          ) -join " "

          Start-Process -FilePath ".\vs_community.exe" -ArgumentList $argList

          # Poll until the real bootstrapper spawns (up to 60s)
          Write-Host "Waiting for vs_setup_bootstrapper to spawn..."
          $bootstrapper = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $bootstrapper = Get-Process -Name "vs_setup_bootstrapper" -ErrorAction SilentlyContinue
            if ($bootstrapper) {
              Write-Host "Found vs_setup_bootstrapper (PID $($bootstrapper.Id))"
              break
            }
          }

          if ($null -eq $bootstrapper) {
            Write-Error "vs_setup_bootstrapper never started"
            exit 1
          }

          # Block until it finishes — don't touch ExitCode, it's unreliable via Get-Process
          Wait-Process -Id $bootstrapper.Id
          Write-Host "vs_setup_bootstrapper exited"

          # Ground truth: verify the layout is actually populated
          $files = (Get-ChildItem $layout -Recurse -File).Count
          $sizeGB = (Get-ChildItem $layout -Recurse -File | 
                     Measure-Object -Property Length -Sum).Sum / 1GB
          $sizeGB = [math]::Round($sizeGB, 2)

          Write-Host "Layout: $files files, $sizeGB GB"

          if ($sizeGB -lt 30) {
            Write-Error "Layout too small ($sizeGB GB) — download did not complete"
            exit 1
          }

          Write-Host "Layout looks good."
      - name: Ultra Compression & Splitting
        run: |
          7z a -t7z -m0=lzma2 -mx=9 -md=128m -ms=on -v2000m VS_Offline_Final.7z "${{ github.workspace }}\VS_Layout"

      - name: Cleanup Layout to Save Space
        run: Remove-Item -Recurse -Force "${{ github.workspace }}\VS_Layout"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} VS_Offline_Final.7z.* `
            --title "Full Offline VS Layout ${{ github.event.inputs.version }}" `
            --notes "Includes: Core, WinUI, .NET Desktop, and C++ Desktop. Download ALL parts, extract the .001 file."
