name: Bundle WinUI Offline Installer
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  bundle-workload:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create a release and upload assets
    
    steps:
      - name: Download VS Bootstrapper
        run: |
          # Fixed: Direct link to the VS 2022 Community bootstrapper
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Create Offline Layout
        run: |
          # Microsoft.VisualStudio.Workload.Universal is the modern ID for WinUI/Windows App SDK
          ./vs_community.exe --layout ./WinUI_Layout --add Microsoft.VisualStudio.Workload.Universal --includeRecommended --lang en-US --passive --norestart

      - name: Aggressive Compression (7-Zip)
        run: |
          # -mx=9: Ultra compression
          # -t7z: 7z format (better than .zip for VS layouts)
          # -ms=on: Solid archive (highly recommended for high file counts like VS layouts)
          7z a -t7z -mx=9 -ms=on WinUI_Offline_Bundle.7z ./WinUI_Layout

      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} WinUI_Offline_Bundle.7z `
            --title "WinUI Offline Installer ${{ github.event.inputs.version }}" `
            --notes "Offline layout for WinUI 3 / Windows App SDK (Microsoft.VisualStudio.Workload.Universal)"
