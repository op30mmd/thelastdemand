name: Unified WinUI Offline Bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0'

jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Bootstrapper
        run: Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_community.exe" -OutFile vs_community.exe

      - name: Check Disk Space
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Create Unified Layout
        run: |
          $layout = "${{ github.workspace }}\VS_Layout"

          $argList = @(
            "--layout `"$layout`"",
            "--add Microsoft.VisualStudio.Workload.CoreEditor",
            "--add Microsoft.VisualStudio.Workload.Universal",
            "--add Microsoft.VisualStudio.Workload.ManagedDesktop",
            "--add Microsoft.VisualStudio.Workload.NativeDesktop",
            "--add Microsoft.VisualStudio.Component.Windows11SDK.26100",
            "--includeRecommended",
            "--includeOptional",
            "--lang en-US",
            "--passive",
            "--norestart"
          ) -join " "

          Start-Process -FilePath ".\vs_community.exe" -ArgumentList $argList
          Write-Host "Installer launched, polling until all VS processes exit..."

          $stableCount = 0
          $lastSize = 0

          while ($true) {
            Start-Sleep -Seconds 15

            $running = Get-Process | Where-Object { $vsProcessNames -contains $_.Name }

            $currentSize = (Get-ChildItem $layout -Recurse -File -ErrorAction SilentlyContinue |
                            Measure-Object -Property Length -Sum).Sum

            $sizeGB = [math]::Round($currentSize / 1GB, 2)
            Write-Host "Running VS procs: $($running.Count) | Layout size: $sizeGB GB"

            if ($running.Count -eq 0) {
              # No VS processes — but wait for size to stabilize before declaring done
              if ($currentSize -eq $lastSize) {
                $stableCount++
                Write-Host "Size stable for $($stableCount * 15)s"
                if ($stableCount -ge 3) {
                  Write-Host "All VS processes gone and size stable. Done."
                  break
                }
              } else {
                $stableCount = 0
              }
            } else {
              $stableCount = 0
            }

            $lastSize = $currentSize
          }

          $files = (Get-ChildItem $layout -Recurse -File).Count
          $sizeGB = [math]::Round($lastSize / 1GB, 2)
          Write-Host "Final layout: $files files, $sizeGB GB"

          # Fix/verify the layout integrity
          Write-Host "Running --fix to repair any incomplete packages..."
          $fixArgs = @(
            "--layout `"$layout`"",
            "--fix",
            "--lang en-US",
            "--passive",
            "--norestart"
          ) -join " "

          Start-Process -FilePath ".\vs_community.exe" -ArgumentList $fixArgs

          # Poll the same way for --fix pass
          $stableCount = 0
          $lastSize = 0

          while ($true) {
            Start-Sleep -Seconds 15

            $running = Get-Process | Where-Object { $vsProcessNames -contains $_.Name }
            $currentSize = (Get-ChildItem $layout -Recurse -File -ErrorAction SilentlyContinue |
                            Measure-Object -Property Length -Sum).Sum
            $sizeGB = [math]::Round($currentSize / 1GB, 2)
            Write-Host "[fix] Running VS procs: $($running.Count) | Layout size: $sizeGB GB"

            if ($running.Count -eq 0) {
              if ($currentSize -eq $lastSize) {
                $stableCount++
                if ($stableCount -ge 3) {
                  Write-Host "Fix pass complete."
                  break
                }
              } else {
                $stableCount = 0
              }
            } else {
              $stableCount = 0
            }
            $lastSize = $currentSize
          }

          if ($sizeGB -lt 5) {
            Write-Error "Layout too small ($sizeGB GB) — download did not complete"
            exit 1
          }

      - name: Inspect Catalog Structure
        run: |
          $layout = "${{ github.workspace }}\VS_Layout"
          $catalog = Get-Content "$layout\Catalog.json" | ConvertFrom-Json

          # Show top-level keys
          Write-Host "=== Top-level keys ==="
          $catalog.PSObject.Properties.Name

          # Show structure of first package entry
          Write-Host "=== First package entry ==="
          $catalog.packages[0] | ConvertTo-Json -Depth 5

          # Try to find one known-missing package
          Write-Host "=== Search for WebSiteProject.DTE ==="
          $catalog.packages | Where-Object { 
            $_.id -like "*WebSiteProject*" 
          } | ConvertTo-Json -Depth 5

          # Show total package count
          Write-Host "=== Total packages: $($catalog.packages.Count) ==="

      - name: Patch Missing Packages
        run: |
          $layout = "${{ github.workspace }}\VS_Layout"
          $catalog = Get-Content "$layout\Catalog.json" | ConvertFrom-Json

          # All package IDs confirmed missing from offline install logs
          $missing = @(
            "Microsoft.VisualStudio.WebSiteProject.DTE",
            "Microsoft.VisualStudio.Diagnostics.AspNetHelper",
            "Microsoft.VisualStudio.Diagnostics.AspNetHelper.Standard",
            "Microsoft.VisualStudio.Platform.CallHierarchy",
            "Microsoft.VisualStudio.Community.ProductArch.Neutral",
            "Microsoft.MSHtml",
            "Microsoft.VisualStudio.VC.Ide.Common",
            "Microsoft.VisualStudio.VC.Ide.Common.Resources",
            "Microsoft.VisualStudio.VC.Ide.Debugger.Resources",
            "Microsoft.VisualStudio.VC.Ide.Debugger.Concord.Resources",
            "Microsoft.VisualStudio.VC.MSVCDis",
            "Microsoft.VisualStudio.VC.MSBuild.v170.Base.Resources",
            "Microsoft.DiaSymReader.PortablePdb",
            "Microsoft.VisualCpp.Servicing.Redist",
            "Microsoft.VisualCpp.RuntimeDebug.14",
            "Microsoft.VisualCpp.CRT.ClickOnce.Msi",
            "Microsoft.VC.14.44.17.14.Servicing"
          )

          foreach ($pkgId in $missing) {
            $packages = $catalog.packages | Where-Object { $_.id -eq $pkgId }
            foreach ($pkg in $packages) {
              foreach ($payload in $pkg.payloads) {
                $url = $payload.url
                $fileName = $payload.fileName
                if (-not $url -or -not $fileName) { continue }

                # Reconstruct the folder name the layout expects
                $folderName = $pkg.id + ",version=" + $pkg.version
                if ($pkg.language)     { $folderName += ",language=" + $pkg.language }
                if ($pkg.chip)         { $folderName += ",chip=" + $pkg.chip }
                if ($pkg.productArch)  { $folderName += ",productarch=" + $pkg.productArch }
                if ($pkg.machineArch)  { $folderName += ",machinearch=" + $pkg.machineArch }

                $destDir = Join-Path $layout $folderName
                $destFile = Join-Path $destDir $fileName

                if (Test-Path $destFile) {
                  Write-Host "Already exists: $destFile"
                  continue
                }

                New-Item -ItemType Directory -Force -Path $destDir | Out-Null
                Write-Host "Downloading $pkgId / $fileName ..."
                try {
                  Invoke-WebRequest -Uri $url -OutFile $destFile -UseBasicParsing
                  Write-Host "OK: $destFile"
                } catch {
                  Write-Warning "FAILED: $url — $_"
                }
              }
            }
          }

          # Final count
          $files = (Get-ChildItem $layout -Recurse -File).Count
          $sizeGB = [math]::Round((Get-ChildItem $layout -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1GB, 2)
          Write-Host "Layout after patch: $files files, $sizeGB GB"

      - name: Dump VS Installer Logs
        if: always()
        run: |
          $logPaths = @(
            "$env:TEMP\dd_bootstrapper*.log",
            "$env:TEMP\dd_setup*.log",
            "$env:TEMP\dd_client*.log",
            "$env:ProgramData\Microsoft\VisualStudio\Packages\_Instances\*\logs\*.log"
          )
          foreach ($pattern in $logPaths) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              Get-Content $_.FullName -Tail 50
            }
          }
          
      - name: Ultra Compression & Splitting
        run: |
          7z a -t7z -m0=lzma2 -mx=9 -md=128m -ms=on -v2000m VS_Offline_Final.7z "${{ github.workspace }}\VS_Layout"

      - name: Cleanup Layout to Save Space
        run: Remove-Item -Recurse -Force "${{ github.workspace }}\VS_Layout"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} VS_Offline_Final.7z.* `
            --title "Full Offline VS Layout ${{ github.event.inputs.version }}" `
            --notes "Includes: Core, WinUI, .NET Desktop, and C++ Desktop. Download ALL parts, extract the .001 file."
